<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Velora AI - Gemini Multilingual Test Bench</title>
  
  <!-- Modern Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #090514;
      --bg-card: rgba(20, 12, 36, 0.6);
      --primary: #8b5cf6;
      --primary-glow: rgba(139, 92, 246, 0.35);
      --secondary: #d946ef;
      --text-main: #f3f1f6;
      --text-muted: #9f94b5;
      --border-glow: rgba(255, 255, 255, 0.08);
      --user-bubble: linear-gradient(135deg, #7c3aed 0%, #5b21b6 100%);
      --ai-bubble: rgba(255, 255, 255, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Gradient glow background blobs */
    .glow-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      z-index: 1;
      pointer-events: none;
    }

    .blob-1 {
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(124, 58, 237, 0.28) 0%, transparent 70%);
      top: -100px;
      left: -100px;
    }

    .blob-2 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(217, 70, 239, 0.2) 0%, transparent 70%);
      bottom: -150px;
      right: -100px;
    }

    /* Container holding the glass interface */
    .app-container {
      width: 100%;
      max-width: 900px;
      height: 90vh;
      max-height: 800px;
      background: var(--bg-card);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-glow);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6), 0 0 80px rgba(124, 58, 237, 0.1);
      z-index: 10;
      overflow: hidden;
      margin: 20px;
    }

    /* Header styling */
    .header {
      padding: 24px;
      border-bottom: 1px solid var(--border-glow);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.02);
    }

    .header-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .header-title {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, #f3f1f6 30%, #d946ef 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.3px;
    }

    .header-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.3);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      color: #c084fc;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #a855f7;
      box-shadow: 0 0 10px #c084fc;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.5; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.5; }
    }

    /* Conversation list area */
    .chat-messages {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
    }

    .chat-messages::-webkit-scrollbar {
      width: 6px;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }

    /* Message Bubbles */
    .message-row {
      display: flex;
      width: 100%;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.ai {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 75%;
      padding: 16px 20px;
      border-radius: 18px;
      font-size: 14.5px;
      line-height: 1.6;
      word-wrap: break-word;
      animation: fadeInSlide 0.3s ease-out forwards;
    }

    .message-row.user .bubble {
      background: var(--user-bubble);
      color: #ffffff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.2);
    }

    .message-row.ai .bubble {
      background: var(--ai-bubble);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-bottom-left-radius: 4px;
    }

    @keyframes fadeInSlide {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Suggestions bar */
    .suggestions-container {
      padding: 0 24px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .suggestions-title {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .suggestions-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .chip {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 8px 16px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chip:hover {
      background: rgba(139, 92, 246, 0.12);
      border-color: rgba(139, 92, 246, 0.4);
      color: #d8b4fe;
      transform: translateY(-1px);
    }

    /* Bottom Input Bar styling */
    .input-bar {
      padding: 20px 24px 24px;
      border-top: 1px solid var(--border-glow);
      display: flex;
      gap: 12px;
      background: rgba(0, 0, 0, 0.15);
    }

    .input-wrapper {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }

    .chat-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 16px 20px;
      border-radius: 16px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 14.5px;
      outline: none;
      transition: all 0.2s ease;
    }

    .chat-input:focus {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(139, 92, 246, 0.6);
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.15);
    }

    .send-btn {
      background: var(--primary);
      border: none;
      width: 50px;
      height: 50px;
      border-radius: 16px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
      flex-shrink: 0;
    }

    .send-btn:hover {
      background: #7c3aed;
      transform: scale(1.03);
      box-shadow: 0 6px 16px rgba(139, 92, 246, 0.45);
    }

    .send-btn:active {
      transform: scale(0.97);
    }

    /* Typing indicator animation */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
    }

    .dot {
      width: 7px;
      height: 7px;
      background-color: var(--text-muted);
      border-radius: 50%;
      opacity: 0.6;
      animation: dotBounce 1.4s infinite ease-in-out;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotBounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }

    /* Welcome Banner */
    .welcome-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100%;
      padding: 40px;
      gap: 16px;
    }

    .welcome-logo {
      font-size: 48px;
      animation: bounceSlow 3s infinite ease-in-out;
    }

    @keyframes bounceSlow {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .welcome-title {
      font-family: 'Outfit', sans-serif;
      font-size: 26px;
      font-weight: 800;
      color: var(--text-main);
    }

    .welcome-desc {
      font-size: 14px;
      color: var(--text-muted);
      max-width: 440px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <!-- Backdrop Glows -->
  <div class="glow-blob blob-1"></div>
  <div class="glow-blob blob-2"></div>

  <!-- App Glass Card -->
  <div class="app-container">
    
    <!-- Top Header -->
    <div class="header">
      <div class="header-info">
        <h1 class="header-title">Velora AI Sandbox</h1>
        <span class="header-subtitle">Tamil & Sinhala Chat Tester</span>
      </div>
      <div class="status-badge">
        <div class="status-dot"></div>
        <span>Gemini 2.5 Flash</span>
      </div>
    </div>

    <!-- Message Stream -->
    <div class="chat-messages" id="chat-messages">
      <div class="welcome-container" id="welcome-banner">
        <div class="welcome-logo">🔮</div>
        <h2 class="welcome-title">வணக்கம் · ආයුබෝවන්</h2>
        <p class="welcome-desc">
          Test multilingual interactions here. Ask questions or type prompts in <strong>Tamil (தமிழ்)</strong> or <strong>Sinhala (සිංහල)</strong>, and Gemini will reply back natively.
        </p>
      </div>
    </div>

    <!-- Quick presets -->
    <div class="suggestions-container">
      <span class="suggestions-title">Tamil Presets (தமிழ்)</span>
      <div class="suggestions-row" style="margin-bottom: 8px;">
        <button class="chip" onclick="usePreset('வணக்கம்! இன்று உங்களுடைய உதவி என்ன?')">💬 வணக்கம்! (Hello)</button>
        <button class="chip" onclick="usePreset('இலங்கையின் சிறந்த சுற்றுலாத் தலங்கள் எவை?')">🗺️ சுற்றுலாத் தலங்கள் (Tour spots)</button>
        <button class="chip" onclick="usePreset('சுவையான பால் சோறு செய்வது எப்படி என்று விளக்கவும்.')">🍚 பால் சோறு (Milk Rice Recipe)</button>
      </div>
      
      <span class="suggestions-title">Sinhala Presets (සිංහල)</span>
      <div class="suggestions-row">
        <button class="chip" onclick="usePreset('ආයුබෝවන්! ඔයාට කොහොමද?')">💬 ආයුබෝවන්! (Hello)</button>
        <button class="chip" onclick="usePreset('ලංකාවේ ලස්සනම බලන්න යන්න පුළුවන් තැන් මොනවද?')">🗺️ සංචාරක ස්ථාන (Tour spots)</button>
        <button class="chip" onclick="usePreset('කිරි බත් සාදා ගන්නා ආකාරය පියවරෙන් පියවර කියා දෙන්න.')">🍚 කිරිබත් සාදන ක්‍රමය (Milk Rice Recipe)</button>
      </div>
    </div>

    <!-- Input Box -->
    <div class="input-bar">
      <div class="input-wrapper">
        <input type="text" class="chat-input" id="chat-input" placeholder="Type a message in Tamil, Sinhala, or English..." autocomplete="off">
      </div>
      <button class="send-btn" id="send-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>

  </div>

  <script>
    const GEMINI_API_KEY = "AQ.Ab8RN6Jy-xeQmdupVm5oTRRLSzZ-BIqok79wu_6TJyq-hgUDYQ";
    const MODEL = "gemini-2.5-flash";
    const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${GEMINI_API_KEY}`;

    const systemInstruction = {
      parts: [
        {
          text: "You are a helpful assistant. You support English, Tamil (தமிழ்), and Sinhala (සිංහල). Respond in the language requested by the user. If they speak in Tamil, respond in Tamil. If they speak in Sinhala, respond in Sinhala."
        }
      ]
    };

    const chatHistory = [];
    
    const messagesContainer = document.getElementById('chat-messages');
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    const welcomeBanner = document.getElementById('welcome-banner');

    // Handle presets
    function usePreset(text) {
      chatInput.value = text;
      sendMessage();
    }

    // Append a message bubble to UI
    function appendMessage(role, text) {
      if (welcomeBanner) {
        welcomeBanner.style.display = 'none';
      }

      const row = document.createElement('div');
      row.className = `message-row ${role === 'user' ? 'user' : 'ai'}`;
      
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerText = text;
      
      row.appendChild(bubble);
      messagesContainer.appendChild(row);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // Append loading dots
    function appendTypingIndicator() {
      const row = document.createElement('div');
      row.className = 'message-row ai';
      row.id = 'typing-indicator-row';
      
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      
      const indicator = document.createElement('div');
      indicator.className = 'typing-indicator';
      
      for(let i=0; i<3; i++) {
        const dot = document.createElement('div');
        dot.className = 'dot';
        indicator.appendChild(dot);
      }
      
      bubble.appendChild(indicator);
      row.appendChild(bubble);
      messagesContainer.appendChild(row);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function removeTypingIndicator() {
      const indicator = document.getElementById('typing-indicator-row');
      if (indicator) {
        indicator.remove();
      }
    }

    // Call API and handle message transaction
    async function sendMessage() {
      const text = chatInput.value.trim();
      if (!text) return;

      chatInput.value = '';
      
      // User message
      appendMessage('user', text);
      chatHistory.push({
        role: "user",
        parts: [{ text: text }]
      });

      // AI Thinking
      appendTypingIndicator();

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            contents: chatHistory,
            systemInstruction: systemInstruction
          })
        });

        removeTypingIndicator();

        if (!response.ok) {
          const errData = await response.text();
          appendMessage('ai', `⚠️ API Response Error (${response.status}): ${errData}`);
          chatHistory.pop(); // Remove failed request
          return;
        }

        const data = await response.json();
        const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text || "No response found.";
        
        appendMessage('ai', reply);
        chatHistory.push({
          role: "model",
          parts: [{ text: reply }]
        });

      } catch (err) {
        removeTypingIndicator();
        appendMessage('ai', `⚠️ Connection Error: ${err.message}`);
        chatHistory.pop();
      }
    }

    // Event hooks
    sendBtn.addEventListener('click', sendMessage);
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });
  </script>
</body>
</html>
