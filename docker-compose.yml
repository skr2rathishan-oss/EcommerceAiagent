services:
  caddy:
    image: caddy:2
    container_name: velora-caddy
    restart: always

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      - frontend
      - backend

  backend:
    build:
      context: ./kapruka-ai-agent
      dockerfile: Dockerfile

    container_name: velora-backend

    expose:
      - "5000"

    env_file:
      - ./kapruka-ai-agent/.env

    volumes:
      - /home/Rathishan/.config/gcloud:/root/.config/gcloud:ro

    environment:
      GOOGLE_CLOUD_PROJECT: spheric-algebra-499718-r2

    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: velora-frontend

    expose:
      - "80"

    depends_on:
      - backend

    restart: always

volumes:
  caddy_data:
  caddy_config:
