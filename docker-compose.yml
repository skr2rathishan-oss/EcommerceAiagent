```yaml
version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: velora-backend

    ports:
      - "5000:5000"

    environment:
      GOOGLE_CLOUD_PROJECT: spheric-algebra-499718-r2

    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: velora-frontend

    ports:
      - "3000:80"

    depends_on:
      - backend

    restart: always
```
